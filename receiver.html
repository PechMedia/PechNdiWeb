<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PECH NDI Cast Receiver</title>
  <link rel="stylesheet" href="/static/style.css?v=1.0.0">
</head>
<body style="background: #000; overflow: hidden; margin: 0; padding: 0;">
  <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;">
    <video id="remoteVideo" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: contain;"></video>
  </div>
  <script src="/static/player.js?v=1.0.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const v = document.getElementById('remoteVideo');
      const p = new NDIWebRTCPlayer(v);
      p.start();
    });
  </script>
</body>
</html>
