<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PECH NDI Stream</title>
  <link rel="stylesheet" href="/static/style.css?v=1.0.16">
  <style>
    /* Direct kiosk protection overrides */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: none;
    }
  </style>
</head>
<body class="pure-player hide-cursor">
  <!-- Fullscreen Edge-to-Edge Video Stage -->
  <div class="pure-video-wrapper" id="videoStage">
    <video id="remoteVideo" autoplay playsinline muted></video>
  </div>

  <!-- Accessible High-Contrast Dynamic Overlay for Visually Impaired -->
  <div id="accessibleOverlay" class="accessible-overlay">
    <div class="overlay-content">
      <div id="overlayText" class="overlay-text">Waiting for Slides...</div>
    </div>
  </div>

  <script src="/static/player.js?v=1.0.16"></script>
  <script>
    let player = null;
    let streamState = {
      isPaused: false,
      message: '',
      connected: false
    };

    const overlay = document.getElementById('accessibleOverlay');
    const overlayText = document.getElementById('overlayText');
    const videoEl = document.getElementById('remoteVideo');

    function updateOverlay() {
      if (streamState.isPaused) {
        overlayText.innerText = streamState.message || "Pausing - slides will show again after video has played";
        overlay.classList.remove('hidden');
      } else if (!streamState.connected) {
        overlayText.innerText = "Waiting for Slides...";
        overlay.classList.remove('hidden');
      } else {
        // Stream is active and connected
        overlay.classList.add('hidden');
      }
    }

    // Attempt screen wake lock so tablet stays active during church service
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        // Ignore wake lock denial
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Strict Kiosk Protection: disable right-click context menu
      window.addEventListener('contextmenu', (e) => e.preventDefault());

      // 2. Prevent multi-touch zoom and gesture zoom
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // 3. Prevent pinch zoom or double tap gestures
      document.addEventListener('dblclick', (e) => e.preventDefault());

      // 4. Request wake lock
      requestWakeLock();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });

      // 5. Initialize WebRTC Player (strictly video-only / muted)
      player = new NDIWebRTCPlayer(videoEl, {
        onStatusChange: (status) => {
          if (status === 'live') {
            streamState.connected = true;
          } else {
            streamState.connected = false;
          }
          updateOverlay();
        },
        onStateUpdate: (state) => {
          // Received real-time state broadcast from server over WebSocket
          streamState.isPaused = !!state.is_paused;
          streamState.message = state.message || '';
          updateOverlay();
        }
      });

      // Video element events to smoothly unhide once first frame decodes
      videoEl.addEventListener('playing', () => {
        streamState.connected = true;
        updateOverlay();
      });

      player.start();

      // Fallback periodic poll of /api/stream/status (every 3 seconds)
      setInterval(async () => {
        try {
          const res = await fetch('/api/stream/status');
          if (res.ok) {
            const data = await res.json();
            streamState.isPaused = !!data.is_paused;
            if (data.message !== undefined) {
              streamState.message = data.message;
            }
            updateOverlay();
          }
        } catch (e) {
          // If server temporarily unreachable, show waiting
          streamState.connected = false;
          updateOverlay();
        }
      }, 3000);
    });
  </script>
</body>
</html>
